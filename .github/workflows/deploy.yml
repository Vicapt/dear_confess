name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 用最终站点地址重新生成页面，保证初始页里写的是真实域名
      - name: Build static pages
        run: |
          node tools/build.js --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          node tools/check.js
      - name: Stage publish directory
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r assets draw dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
