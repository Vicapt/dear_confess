name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 用最终站点地址重新生成页面，保证初始页里写的是真实域名
      # 站点地址优先取仓库变量 BASE_URL，未设置时回退到自定义域名 / 默认 Pages 域名
      - name: Build static pages
        run: |
          BASE="${{ vars.BASE_URL || 'https://cards.vicapt.top' }}"
          node tools/build.js --base "$BASE"
          node tools/check.js
      - name: Stage publish directory
        run: |
          mkdir -p dist
          cp index.html index.json dist/
          cp ai.txt llms.txt robots.txt sitemap.xml dist/
          cp -r draw dist/
          # 自定义域名必须随发布一起带上，否则 Pages 会丢失 CNAME
          [ -f CNAME ] && cp CNAME dist/ || true
      # 防止旧结果页（含已废弃的 .json 镜像）残留在发布目录里
      - name: Verify published pages
        run: |
          test -f dist/index.html
          test -f dist/index.json
          ls dist/draw/*.html | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
